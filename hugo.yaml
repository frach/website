baseURL: https://rachwalak.net/
title: Filip Rachwalak

enableRobotsTXT: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    # - identifier: services
    #   name: Services
    #   pageRef: /services
    #   weight: 1
    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 2
    - identifier: about
      name: About
      pageRef: /about
      weight: 3
    - identifier: contact
      name: Contact
      url: "mailto:contact@rachwalak.net"
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: "https://github.com/frach"
      params:
        icon: github
    - name: LinkedIn
      weight: 7
      url: "https://www.linkedin.com/in/filip-rachwalak/"
      params:
        icon: linkedin

params:
  description: "DevOps engineer with Terraform, EKS and serverless on AWS."
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 28
      height: 28
  footer:
    displayCopyright: false
    displayPoweredBy: false
